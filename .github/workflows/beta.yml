# Builds the EqUpdater 3 beta installer and keeps it as a workflow artifact.
# Manual only (workflow_dispatch), and it publishes nothing: no release, no tag.
# The build runs the headless self-test (tools/build_v3.py) and fails if it fails.
name: beta-package

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pillow certifi pyside6 pyinstaller psutil

      - name: Test suite, then build, self-test and package
        run: python tools/build_v3.py --release --setup

      - uses: actions/upload-artifact@v4
        with:
          name: EqUpdater3-beta-windows
          path: dist/EqUpdater3-v*-Windows-Installer.exe
          if-no-files-found: error

  linux:
    # Builds the Linux AppImage and runs the headless self-test inside it. Manual, publishes nothing.
    # NOTE: written without access to a Linux machine; the first run of this job is its first test.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries Qt's X11 plugin and the self-test need
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1             libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0             libxcb-xkb1 libxcb-xinerama0 libxcb-util1 fonts-liberation

      - name: Install Python dependencies
        run: python -m pip install --upgrade pillow certifi pyside6 pyinstaller psutil

      - name: Test suite
        run: QT_QPA_PLATFORM=offscreen python tools/check.py --log test-log.txt

      - name: Build the AppImage
        run: python tools/build_appimage_v3.py

      - name: Self-test the AppImage (all pages, all skins, offscreen)
        run: |
          set -e
          APPIMAGE=$(ls dist/EqUpdater3-v*-Linux-x86_64.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen "$APPIMAGE" --self-test=selftest.json --gui
          cat selftest.json

      - uses: actions/upload-artifact@v4
        with:
          name: EqUpdater3-beta-linux
          path: dist/EqUpdater3-v*-Linux-x86_64.AppImage
          if-no-files-found: error

